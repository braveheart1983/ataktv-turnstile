<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #0F172A;
      color: #E2E8F0;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }
    h3 { color: #38BDF8; font-weight: 500; }
    .container { text-align: center; padding: 20px; }
    .loading { color: #94A3B8; font-size: 14px; }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <div class="container">
    <h3>🔒 Güvenlik Doğrulaması</h3>
    <p class="loading">Lütfen bekleyin...</p>
    <!-- Invisible modda widget görünmez ama bu div gerekli -->
    <div id="turnstile-container"></div>
  </div>

  <script>
    function onTurnstileSuccess(token) {
      if (window.AndroidBridge && window.AndroidBridge.onTokenReceived) {
        window.AndroidBridge.onTokenReceived(token);
      }
    }

    function onTurnstileError(errorCode) {
      console.error("Turnstile hatası: " + errorCode);
    }

    // Invisible modda explicit render gerekli
    window.onload = function() {
      if (typeof turnstile !== 'undefined') {
        turnstile.render('#turnstile-container', {
          sitekey: '0x4AAAAAAE-3xSyzkTbmlh41',
          callback: onTurnstileSuccess,
          'error-callback': onTurnstileError,
          theme: 'dark',
          size: 'invisible'
        });
      } else {
        // API henüz yüklenmediyse bekle
        setTimeout(arguments.callee, 100);
      }
    };
  </script>
</body>
</html>
